<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">World of Seeds</title>
  <desc id="desc">Pousse stylisée dans un carré vert sombre</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173d2e"/>
      <stop offset="0.58" stop-color="#0d2a20"/>
      <stop offset="1" stop-color="#071b14"/>
    </linearGradient>
    <linearGradient id="sprout" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#b8ffd4"/>
      <stop offset="0.45" stop-color="#73f3aa"/>
      <stop offset="1" stop-color="#39c978"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#tile)" stroke="#7df0aa" stroke-opacity=".28" stroke-width="1.5"/>
  <path d="M48 67V42" fill="none" stroke="url(#sprout)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M48 45C36 45 27 39 25 28c13-1 22 4 23 17Z" fill="none" stroke="url(#sprout)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M49 41c2-15 13-23 31-22-1 17-12 27-31 27" fill="none" stroke="url(#sprout)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 69h32" fill="none" stroke="url(#sprout)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="70" cy="69" r="3.2" fill="#b9ffd4"/>
</svg>

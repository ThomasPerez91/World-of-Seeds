version: 2

# Security and maintenance updates arrive as pull requests that run the full CI.
# They target develop, like every other change; master only receives promotions from develop.
# Minor and patch updates are grouped per ecosystem; major updates stay separate for review.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: "/backend"
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      # The frontend build stays on even-numbered Node LTS releases.
      - dependency-name: node
        versions: [">= 25, < 26", ">= 27, < 28"]
  - package-ecosystem: docker
    directory: "/discord-bot"
    target-branch: develop
    schedule:
      interval: weekly

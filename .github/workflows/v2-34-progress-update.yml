name: V2-34 progress update

on:
  push:
    branches:
      - feat/v2-34-release-candidate

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Replace obsolete progress tail
        env:
          TAIL_B64: 
        run: |
          python3 -c 'import base64, os; from pathlib import Path; p=Path("docs/agent/PROGRESS.md"); t=p.read_text(encoding="utf-8"); m="\n## Next task\n"; assert m in t; p.write_text(t.partition(m)[0]+"\n"+base64.b64decode(os.environ["TAIL_B64"]).decode(), encoding="utf-8")'
          git diff --check
      - name: Commit progress update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agent/PROGRESS.md
          git commit -m "docs(v2): update progress for release candidate"
          git push origin HEAD:feat/v2-34-release-candidate

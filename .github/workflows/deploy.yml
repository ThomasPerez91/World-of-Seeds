name: Deploy to OVH

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - deploy-release
  release:
    types:
      - published

permissions: {}

concurrency:
  group: world-of-seeds-production
  cancel-in-progress: false

jobs:
  handoff:
    name: Route release through master
    if: >-
      github.event_name == 'release' &&
      github.event.release.prerelease == false &&
      github.event.release.target_commitish == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate and dispatch the stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          jq -n \
            --arg sha "$RELEASE_SHA" \
            --arg tag "$RELEASE_TAG" \
            '{event_type: "deploy-release", client_payload: {sha: $sha, tag: $tag}}' \
            | gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/dispatches" \
                --input -

  build:
    name: Build immutable image
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'repository_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Resolve the deployment revision
        id: context
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            DEPLOY_SHA="$DISPATCH_SHA"
            DEPLOY_TAG="$DISPATCH_TAG"
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$DEPLOY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          else
            DEPLOY_SHA="$GITHUB_SHA"
            DEPLOY_TAG=""
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
          printf 'sha=%s\n' "$DEPLOY_SHA" >>"$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$DEPLOY_TAG" >>"$GITHUB_OUTPUT"

      - name: Check out the deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ steps.context.outputs.sha }}

      - name: Verify the published release
        if: github.event_name == 'repository_dispatch'
        env:
          DEPLOY_SHA: ${{ steps.context.outputs.sha }}
          DEPLOY_TAG: ${{ steps.context.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DEPLOY_TAG")"
          jq -e \
            --arg tag "$DEPLOY_TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false and .target_commitish == "master"' \
            <<<"$release_json" >/dev/null
          git fetch --force origin \
            "refs/tags/$DEPLOY_TAG:refs/tags/$DEPLOY_TAG"
          [[ "$(git rev-list -n 1 "$DEPLOY_TAG")" == "$DEPLOY_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_SHA" ]]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/thomasperez91/world-of-seeds:sha-${{ steps.context.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.context.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    name: Deploy immutable image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate deployment configuration
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          SSH_HOST: ${{ vars.OVH_SSH_HOST }}
          SSH_PORT: ${{ vars.OVH_SSH_PORT }}
          SSH_USER: ${{ vars.OVH_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -n "$SSH_HOST" ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ -n "$SSH_PRIVATE_KEY" ]]
          [[ -n "$SSH_KNOWN_HOSTS" ]]

      - name: Configure the restricted SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$HOME/.ssh/world-of-seeds-deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 \
            "$HOME/.ssh/world-of-seeds-deploy" \
            "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/world-of-seeds-deploy" >/dev/null

      - name: Deploy on OVH
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          REGISTRY_USER: ${{ github.repository_owner }}
          SSH_HOST: ${{ vars.OVH_SSH_HOST }}
          SSH_PORT: ${{ vars.OVH_SSH_PORT }}
          SSH_USER: ${{ vars.OVH_SSH_USER }}
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$GHCR_TOKEN" \
            | ssh \
                -i "$HOME/.ssh/world-of-seeds-deploy" \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
                -p "$SSH_PORT" \
                "$SSH_USER@$SSH_HOST" \
                "deploy-world-of-seeds $IMAGE_DIGEST $REGISTRY_USER"

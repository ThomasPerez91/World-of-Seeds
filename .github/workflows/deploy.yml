name: Legacy V1 deployment disabled

on:
  workflow_dispatch:

permissions: {}

jobs:
  disabled:
    name: V1 deployment is archived
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy deployment
        run: |
          echo "The V1 GitHub deployment path is permanently disabled after the V2 production cutover."
          echo "V1 remains preserved by its immutable Git tag/release and the rollback server is managed separately."
          exit 1

name: Apply torrent delete confirmation hotfix

on:
  push:
    branches:
      - hotfix/torrent-delete-confirmation

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v7
        with:
          ref: hotfix/torrent-delete-confirmation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply explicit two-click confirmation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          icons = Path('frontend/src/components/icons.tsx')
          text = icons.read_text()
          text = text.replace('import { useEffect, useRef, useState } from "react";\n', '')
          text = text.replace('  Check,\n', '')
          old = '''export function DeleteIcon(props: AppIconProps) {
            const iconRef = useRef<SVGSVGElement>(null);
            const [armed, setArmed] = useState(false);

            useEffect(() => {
              const button = iconRef.current?.closest("button");
              if (!(button instanceof HTMLButtonElement) || button.closest(".torrent-card-actions") === null) {
                return;
              }

              const handleClick = (event: MouseEvent) => {
                if (armed) {
                  setArmed(false);
                  return;
                }
                event.preventDefault();
                event.stopPropagation();
                setArmed(true);
              };
              const handleBlur = () => setArmed(false);

              button.setAttribute("aria-pressed", armed ? "true" : "false");
              button.addEventListener("click", handleClick, true);
              button.addEventListener("blur", handleBlur);
              return () => {
                button.removeEventListener("click", handleClick, true);
                button.removeEventListener("blur", handleBlur);
                button.removeAttribute("aria-pressed");
              };
            }, [armed]);

            return armed
              ? <Check ref={iconRef} {...decorative} {...props} />
              : <Trash2 ref={iconRef} {...decorative} {...props} />;
          }
'''
          new = '''export function DeleteIcon(props: AppIconProps) {
            return <Trash2 {...decorative} {...props} />;
          }
'''
          if old not in text:
              raise SystemExit('DeleteIcon stateful implementation not found')
          icons.write_text(text.replace(old, new))

          page = Path('frontend/src/features/torrents/UserDownloadsPage.tsx')
          text = page.read_text()
          marker = '''  const { formatBytes, formatDate, t } = useI18n();
          const rowStatus = torrentRowStatus(torrent);
'''
          replacement = '''  const { formatBytes, formatDate, t } = useI18n();
          const [cancelArmed, setCancelArmed] = useState(false);
          const rowStatus = torrentRowStatus(torrent);

          function handleCancelClick() {
            if (!cancelArmed) {
              setCancelArmed(true);
              return;
            }
            setCancelArmed(false);
            onCancel();
          }
'''
          if marker not in text:
              raise SystemExit('TorrentItem state marker not found')
          text = text.replace(marker, replacement, 1)
          old_button = '''                        disabled={cancelBusy}
                        onClick={onCancel}
                        aria-label={t(torrent.state === "ready" ? "downloads.deleteNamed" : "downloads.cancelNamed", { name: torrent.name })}
                      >
                        <DeleteIcon />
'''
          new_button = '''                        disabled={cancelBusy}
                        onClick={handleCancelClick}
                        onBlur={() => setCancelArmed(false)}
                        aria-pressed={cancelArmed}
                        aria-label={t(torrent.state === "ready" ? "downloads.deleteNamed" : "downloads.cancelNamed", { name: torrent.name })}
                      >
                        {cancelArmed ? <Check aria-hidden="true" /> : <DeleteIcon />}
'''
          if old_button not in text:
              raise SystemExit('Torrent delete button marker not found')
          page.write_text(text.replace(old_button, new_button, 1))

          icon_test = Path('frontend/src/components/icons.test.tsx')
          icon_test.write_text('''import { render } from "@testing-library/react";\nimport { describe, expect, it } from "vitest";\n\nimport { DeleteIcon } from "./icons";\n\ndescribe("DeleteIcon", () => {\n  it("reste une icône décorative sans intercepter les clics du bouton parent", () => {\n    const view = render(<DeleteIcon />);\n    expect(view.container.querySelector(".lucide-trash-2")).toBeTruthy();\n  });\n});\n''')

          page_test = Path('frontend/src/features/torrents/UserDownloadsPage.test.tsx')
          text = page_test.read_text()
          old_cancel = '''    expect(cancelButton.getAttribute("aria-pressed")).toBe("true");
            expect(cancelButton.querySelector(".lucide-check")).toBeTruthy();
            await user.click(cancelButton);
'''
          new_cancel = '''    expect(cancelButton.getAttribute("aria-pressed")).toBe("true");
            const cancelConfirmIcon = cancelButton.querySelector(".lucide-check");
            expect(cancelConfirmIcon).toBeTruthy();
            await user.click(cancelConfirmIcon as Element);
'''
          if old_cancel not in text:
              raise SystemExit('Cancel confirmation test marker not found')
          text = text.replace(old_cancel, new_cancel, 1)
          old_delete = '''    expect(deleteButton.getAttribute("aria-pressed")).toBe("true");
            expect(deleteButton.querySelector(".lucide-check")).toBeTruthy();
            await user.click(deleteButton);
'''
          new_delete = '''    expect(deleteButton.getAttribute("aria-pressed")).toBe("true");
            const deleteConfirmIcon = deleteButton.querySelector(".lucide-check");
            expect(deleteConfirmIcon).toBeTruthy();
            await user.click(deleteConfirmIcon as Element);
'''
          if old_delete not in text:
              raise SystemExit('Delete confirmation test marker not found')
          page_test.write_text(text.replace(old_delete, new_delete, 1))
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate frontend hotfix
        working-directory: frontend
        run: |
          npm run check
          npm run test -- src/components/icons.test.tsx src/features/torrents/UserDownloadsPage.test.tsx
          npm run build

      - name: Commit validated hotfix and remove helper workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/hotfix-torrent-delete-confirmation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/icons.tsx frontend/src/components/icons.test.tsx frontend/src/features/torrents/UserDownloadsPage.tsx frontend/src/features/torrents/UserDownloadsPage.test.tsx .github/workflows/hotfix-torrent-delete-confirmation.yml
          git diff --cached --check
          git commit -m 'fix(frontend): make torrent delete confirmation actionable'
          git push origin HEAD:hotfix/torrent-delete-confirmation

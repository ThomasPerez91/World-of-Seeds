name: Release review toast v2.2.1 fixes

on:
  push:
    branches:
      - fix/release-review-toast-v2.2.1
    paths:
      - .github/workflows/release-review-toast-v221.yml

permissions:
  contents: write

jobs:
  prepare-review-fixes:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out review-fix branch
        uses: actions/checkout@v7
        with:
          ref: fix/release-review-toast-v2.2.1
          fetch-depth: 0

      - name: Apply targeted release review fixes
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/main.tsx")
          source = path.read_text(encoding="utf-8")
          old = 'import "./toast-system.css";'
          new = 'import toastSystemStylesheetUrl from "./toast-system.css?url";'
          if old not in source:
              raise SystemExit("toast stylesheet import anchor not found")
          source = source.replace(old, new, 1)
          old = 'appendStylesheet(wos21FinalStylesheetUrl, "wos-2-1-final-polish");'
          new = old + '\nappendStylesheet(toastSystemStylesheetUrl, "toast-system");'
          if old not in source:
              raise SystemExit("stylesheet append anchor not found")
          source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")

          path = Path("frontend/src/i18n.tsx")
          source = path.read_text(encoding="utf-8")
          old = '''function interpolate(template: string, params: Params = {}): string {\n  return template.replace(/\\{([a-zA-Z][a-zA-Z0-9_]*)\\}/g, (match, key: string) =>\n    Object.hasOwn(params, key) ? String(params[key]) : match,\n  );\n}'''
          new = old + '''\n\nexport function translate(locale: Locale, key: MessageKey, params?: Params): string {\n  return interpolate(messages[locale][key], params);\n}'''
          if old not in source:
              raise SystemExit("i18n interpolation anchor not found")
          source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")

          path = Path("frontend/src/App.tsx")
          source = path.read_text(encoding="utf-8")
          old = 'import { I18nProvider, useI18n, type Locale } from "./i18n";'
          new = 'import { I18nProvider, translate, useI18n, type Locale } from "./i18n";'
          if old not in source:
              raise SystemExit("App i18n import anchor not found")
          source = source.replace(old, new, 1)
          old = 'feedback.toast({ tone: "success", message: t("language.saved") });'
          new = 'feedback.toast({ tone: "success", message: translate(locale, "language.saved") });'
          if old not in source:
              raise SystemExit("language success toast anchor not found")
          source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")

          path = Path("frontend/src/App.test.tsx")
          source = path.read_text(encoding="utf-8")
          old = '''    await screen.findByRole("heading", { name: "Account settings" });\n    expect(screen.getByRole("button", { name: "General" }).getAttribute("aria-current")).toBe("page");'''
          new = '''    await screen.findByRole("heading", { name: "Account settings" });\n    expect(await screen.findByText("Language preference saved.")).toBeTruthy();\n    expect(screen.queryByText("Préférence de langue enregistrée.")).toBeNull();\n    expect(screen.getByRole("button", { name: "General" }).getAttribute("aria-current")).toBe("page");'''
          if old not in source:
              raise SystemExit("language persistence test anchor not found")
          source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")

          # Static cascade guard: the toast stylesheet must be appended after every legacy stylesheet.
          main = Path("frontend/src/main.tsx").read_text(encoding="utf-8")
          assert main.index('appendStylesheet(toastSystemStylesheetUrl, "toast-system");') > main.index('appendStylesheet(wos21FinalStylesheetUrl, "wos-2-1-final-polish");')
          PY
          git diff --check

      - name: Validate targeted frontend review fixes
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run test -- src/App.test.tsx src/components/Feedback.test.tsx
          npm run build

      - name: Validate release version
        run: |
          set -Eeuo pipefail
          python scripts/versioning.py check --channel v2 --expected-version 2.2.1 --print-version

      - name: Commit validated review fixes and remove helper
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-review-toast-v221.yml
          git add frontend/src/main.tsx frontend/src/i18n.tsx frontend/src/App.tsx frontend/src/App.test.tsx
          git diff --cached --check
          git commit -m "fix(frontend): address toast release review findings"
          git push origin HEAD:fix/release-review-toast-v2.2.1

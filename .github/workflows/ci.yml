name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: world_of_seeds_test
          POSTGRES_USER: world_of_seeds
          POSTGRES_PASSWORD: world_of_seeds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U world_of_seeds -d world_of_seeds_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WOS_DATABASE_URL: postgresql+asyncpg://world_of_seeds:world_of_seeds_test@127.0.0.1:5432/world_of_seeds_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          working-directory: backend
      - run: uv sync --frozen --dev
      - name: Verify Docker dependency export
        run: |
          uv export --frozen --no-dev --no-emit-project --no-header \
            --format requirements.txt --output-file /tmp/requirements.lock
          diff --unified requirements.lock /tmp/requirements.lock
      - run: uv run alembic -c alembic.ini upgrade head
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image through Compose
        run: |
          cp .env.example .env
          mkdir -p "$RUNNER_TEMP/seedbox"
          SEEDBOX_HOST_PATH="$RUNNER_TEMP/seedbox" docker compose build app
      - name: Smoke-check Uvicorn configuration
        run: >-
          SEEDBOX_HOST_PATH="$RUNNER_TEMP/seedbox"
          docker compose run --rm --no-deps app uvicorn --version

name: V2-35 stable version bootstrap

on:
  push:
    branches:
      - feat/v2-35-stable-release

permissions:
  contents: write

jobs:
  stable-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V2-35 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/v2-35-stable-release
          fetch-depth: 0

      - name: Set synchronized stable V2 version
        run: |
          set -Eeuo pipefail
          if [[ "$(cat VERSION)" == "2.0.0" ]]; then
            echo "Stable version already synchronized."
            exit 0
          fi
          python3 scripts/versioning.py set --channel v2 2.0.0
          python3 scripts/versioning.py check \
            --channel v2 \
            --expected-version 2.0.0 \
            --expected-tag v2.0.0 \
            --print-version

      - name: Commit only synchronized version mirrors
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- \
            VERSION \
            backend/pyproject.toml \
            backend/app/__init__.py \
            backend/uv.lock \
            frontend/package.json \
            frontend/package-lock.json \
            frontend/src/version.ts; then
            echo "No version changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            VERSION \
            backend/pyproject.toml \
            backend/app/__init__.py \
            backend/uv.lock \
            frontend/package.json \
            frontend/package-lock.json \
            frontend/src/version.ts
          git diff --cached --check
          git commit -m "chore(v2-35): set stable version 2.0.0"
          git push origin HEAD:feat/v2-35-stable-release

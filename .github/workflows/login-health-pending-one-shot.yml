name: WOS login health pending one-shot

on:
  push:
    branches:
      - fix/ux-2.1-login-polish-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ux-2.1-login-polish-v2
          fetch-depth: 0

      - name: Apply pending health state
        shell: bash
        run: |
          set -Eeuo pipefail
          perl -0pi -e 's/useState<"healthy" \| "unavailable">\("healthy"\)/useState<"pending" | "healthy" | "unavailable">("pending")/' frontend/src/App.tsx
          perl -0pi -e 's/const message = health === "healthy" \? t\("health\.healthy"\) : t\("health\.unavailable"\);/const message = health === "pending" ? t("health.checking") : health === "healthy" ? t("health.healthy") : t("health.unavailable");/' frontend/src/App.tsx
          grep -q 'useState<"pending" | "healthy" | "unavailable">("pending")' frontend/src/App.tsx
          grep -q 'health === "pending" ? t("health.checking")' frontend/src/App.tsx
          cat >> frontend/src/wos-2-1.css <<'CSS'

/* Health remains neutral until the first health response arrives. */
.service-health-indicator.pending .service-health-dot {
  background: #91aa9e;
  box-shadow: 0 0 0 5px rgba(145, 170, 158, 0.08), 0 0 14px rgba(145, 170, 158, 0.26);
}
CSS

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit review fix
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/login-health-pending-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ux): keep login health pending until checked'
          git push origin HEAD:fix/ux-2.1-login-polish-v2

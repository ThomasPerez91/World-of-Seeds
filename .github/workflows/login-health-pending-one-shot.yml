name: WOS login health pending one-shot

on:
  push:
    branches:
      - fix/ux-2.1-login-polish-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ux-2.1-login-polish-v2
          fetch-depth: 0
      - name: Preserve unknown health state
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('frontend/src/App.tsx')
          app = app_path.read_text()
          old = 'const [health, setHealth] = useState<"healthy" | "unavailable">("healthy");'
          new = 'const [health, setHealth] = useState<"pending" | "healthy" | "unavailable">("pending");'
          assert old in app
          app = app.replace(old, new, 1)
          old = 'const message = health === "healthy" ? t("health.healthy") : t("health.unavailable");'
          new = '''const message =
              health === "pending"
                ? t("health.checking")
                : health === "healthy"
                  ? t("health.healthy")
                  : t("health.unavailable");'''
          assert old in app
          app = app.replace(old, new, 1)
          app_path.write_text(app)

          css_path = Path('frontend/src/wos-2-1.css')
          css = css_path.read_text()
          anchor = '''.service-health-indicator.unavailable .service-health-dot {
            background: #ff6868;
            box-shadow: 0 0 0 5px rgba(255, 104, 104, 0.09), 0 0 18px rgba(255, 86, 86, 0.58);
          }
'''
          addition = anchor + '''
          .service-health-indicator.pending .service-health-dot {
            background: #91aa9e;
            box-shadow: 0 0 0 5px rgba(145, 170, 158, 0.08), 0 0 14px rgba(145, 170, 158, 0.26);
          }
'''
          assert anchor in css
          css = css.replace(anchor, addition, 1)
          css_path.write_text(css)
          PY
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Commit fix
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/login-health-pending-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ux): keep login health pending until checked'
          git push origin HEAD:fix/ux-2.1-login-polish-v2

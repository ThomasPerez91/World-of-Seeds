name: WOS 2.1 login polish one-shot

on:
  push:
    branches:
      - fix/ux-2.1-login-polish-v2

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/ux-2.1-login-polish-v2
          fetch-depth: 0

      - name: Apply login polish
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('frontend/src/App.tsx')
          app = app_path.read_text()

          service = '''function ServiceHealth() {
            const { t } = useI18n();
            const [health, setHealth] = useState<"healthy" | "unavailable">("healthy");
            const mounted = useRef(true);

            const check = useCallback(async () => {
              try {
                const status = await api.health();
                if (mounted.current) setHealth(status.status === "ok" ? "healthy" : "unavailable");
              } catch {
                if (mounted.current) setHealth("unavailable");
              }
            }, []);

            useEffect(() => {
              mounted.current = true;
              void check();
              const interval = window.setInterval(() => void check(), 30_000);
              return () => {
                mounted.current = false;
                window.clearInterval(interval);
              };
            }, [check]);

            const message = health === "healthy" ? t("health.healthy") : t("health.unavailable");

            return (
              <div
                className={`service-health-indicator ${health}`}
                role="status"
                aria-live="polite"
                aria-label={message}
                aria-describedby="service-health-tooltip"
                tabIndex={0}
              >
                <span className="service-health-dot" aria-hidden="true" />
                <span id="service-health-tooltip" className="service-health-tooltip" role="tooltip">
                  {message}
                </span>
              </div>
            );
          }

          function LoginScreen'''
          app, count = re.subn(
              r'function ServiceHealth\(\) \{.*?\n\}\n\nfunction LoginScreen',
              service,
              app,
              count=1,
              flags=re.S,
          )
          assert count == 1, 'ServiceHealth replacement failed'

          header_pattern = re.compile(
              r'<header className="login-header" aria-label="World of Seeds">\s*'
              r'<img src="/title\.webp\?rev=a9c84cc" alt="World of Seeds"\s*/>\s*'
              r'</header>'
          )
          header_replacement = '''<header className="login-header" aria-label="World of Seeds">
                <img src="/title.webp?rev=a9c84cc" alt="World of Seeds" />
                <ServiceHealth />
              </header>'''
          app, count = header_pattern.subn(header_replacement, app, count=1)
          assert count == 1, 'Login header block not found'

          start_pattern = re.compile(
              r'<section className="login-card" aria-labelledby="login-title">.*?<Card className="form-card">',
              re.S,
          )
          new_start = '''<section className="login-card" aria-labelledby="login-title">
                <div className="login-brand-row">
                  <img className="login-title-image" src="/title.webp?rev=a9c84cc" alt="" aria-hidden="true" />
                  <LanguageSelector variant="flag-toggle" />
                </div>
                <h1 className="visually-hidden">World of Seeds</h1>
                <p className="brand-copy">{t("login.tagline")}</p>
                <div className="login-divider" />
                <Card className="form-card">'''
          app, count = start_pattern.subn(new_start, app, count=1)
          assert count == 1, 'Login card header replacement failed'
          app_path.write_text(app)

          Path('frontend/src/components/LanguageSelector.tsx').write_text('''import { useI18n, type Locale } from "../i18n";

          export function LanguageSelector({
            disabled = false,
            onChange,
            variant = "select",
          }: {
            disabled?: boolean;
            onChange?: (locale: Locale) => void | Promise<void>;
            variant?: "select" | "flag-toggle";
          }) {
            const { locale, setLocale, t } = useI18n();

            function change(nextLocale: Locale) {
              setLocale(nextLocale);
              void onChange?.(nextLocale);
            }

            if (variant === "flag-toggle") {
              const nextLocale: Locale = locale === "fr" ? "en" : "fr";
              const currentLabel = t(locale === "fr" ? "language.fr" : "language.en");
              return (
                <button
                  type="button"
                  className="language-flag-toggle"
                  aria-label={`${t("language.label")} : ${currentLabel}`}
                  disabled={disabled}
                  onClick={() => change(nextLocale)}
                >
                  <span aria-hidden="true">{locale === "fr" ? "🇫🇷" : "🇬🇧"}</span>
                </button>
              );
            }

            return (
              <label className="language-selector">
                <span>{t("language.label")}</span>
                <select
                  aria-label={t("language.label")}
                  value={locale}
                  disabled={disabled}
                  onChange={(event) => change(event.target.value as Locale)}
                >
                  <option value="fr">🇫🇷  {t("language.fr")}</option>
                  <option value="en">🇬🇧  {t("language.en")}</option>
                </select>
              </label>
            );
          }
          ''')

          i18n_path = Path('frontend/src/i18n.tsx')
          i18n = i18n_path.read_text()
          old_fr = '"login.tagline": "Accédez à vos téléchargements torrents en toute liberté, dans votre espace privé.",'
          old_en = '"login.tagline": "Access your torrent downloads freely, from your private space.",'
          assert old_fr in i18n and old_en in i18n, 'Login tagline translations not found'
          i18n = i18n.replace(old_fr, '"login.tagline": "Vos téléchargements en toute liberté.",', 1)
          i18n = i18n.replace(old_en, '"login.tagline": "Your downloads, with complete freedom.",', 1)
          i18n_path.write_text(i18n)

          test_path = Path('frontend/src/App.test.tsx')
          tests = test_path.read_text()
          replacements = [
              (
                  'expect(screen.getByRole("combobox", { name: "Langue" })).toHaveProperty("value", "fr");',
                  'expect(screen.getByRole("button", { name: "Langue : Français" })).toBeDefined();',
              ),
              (
                  'await user.selectOptions(screen.getByRole("combobox", { name: "Langue" }), "en");\n    expect(screen.getByRole("button", { name: "Hide password" })).toBeDefined();',
                  'await user.click(screen.getByRole("button", { name: "Langue : Français" }));\n    expect(screen.getByRole("button", { name: "Language : English" })).toBeDefined();\n    expect(screen.getByRole("button", { name: "Hide password" })).toBeDefined();',
              ),
              (
                  'await user.selectOptions(screen.getByRole("combobox", { name: "Langue" }), "en");\n    await user.type(screen.getByLabelText("Username"), "thomas");',
                  'await user.click(screen.getByRole("button", { name: "Langue : Français" }));\n    await user.type(screen.getByLabelText("Username"), "thomas");',
              ),
              (
                  'expect(screen.getByText("Tous les services fonctionnent normalement.")).toBeDefined();\n    await user.click(screen.getByRole("button", { name: "Vérifier l’état du service" }));\n    await screen.findByText("Le service est momentanément interrompu.");',
                  'expect(\n      screen.getByRole("status", { name: "Tous les services fonctionnent normalement." }),\n    ).toBeDefined();\n    expect(screen.queryByRole("button", { name: "Vérifier l’état du service" })).toBeNull();',
              ),
          ]
          for old, new in replacements:
              assert old in tests, f'Test replacement not found: {old[:60]}'
              tests = tests.replace(old, new, 1)
          test_path.write_text(tests)

          css_path = Path('frontend/src/wos-2-1.css')
          css = css_path.read_text()
          marker = '/* ---------- Login polish v2: glass, flag toggle, passive health ---------- */'
          assert marker not in css
          css += r'''

          /* ---------- Login polish v2: glass, flag toggle, passive health ---------- */

          .login-header {
            justify-content: space-between;
          }

          .login-header .service-health-indicator {
            position: relative;
            display: grid;
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            margin-left: auto;
            place-items: center;
            border-radius: 999px;
            outline: none;
          }

          .service-health-indicator .service-health-dot {
            display: block;
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: #6ef0a9;
            box-shadow: 0 0 0 5px rgba(110, 240, 169, 0.09), 0 0 18px rgba(74, 236, 151, 0.62);
            animation: wos-health-pulse 1.8s ease-in-out infinite;
          }

          .service-health-indicator.unavailable .service-health-dot {
            background: #ff6868;
            box-shadow: 0 0 0 5px rgba(255, 104, 104, 0.09), 0 0 18px rgba(255, 86, 86, 0.58);
          }

          .service-health-indicator:focus-visible {
            box-shadow: 0 0 0 3px rgba(105, 241, 166, 0.16);
          }

          .service-health-tooltip {
            position: absolute;
            z-index: 30;
            top: calc(100% + 9px);
            right: 0;
            width: max-content;
            max-width: min(290px, calc(100vw - 2rem));
            padding: 0.55rem 0.7rem;
            color: #dff7e9;
            border: 1px solid rgba(121, 231, 170, 0.25);
            border-radius: 10px;
            background: rgba(3, 28, 19, 0.92);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(16px) saturate(125%);
            -webkit-backdrop-filter: blur(16px) saturate(125%);
            font-size: 0.74rem;
            font-weight: 650;
            line-height: 1.35;
            text-align: left;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-4px);
            transition: opacity 150ms ease, transform 150ms ease;
          }

          .service-health-indicator:hover .service-health-tooltip,
          .service-health-indicator:focus-visible .service-health-tooltip {
            opacity: 1;
            transform: translateY(0);
          }

          @keyframes wos-health-pulse {
            0%, 100% { opacity: 0.72; transform: scale(0.92); }
            50% { opacity: 1; transform: scale(1.12); }
          }

          .login-card {
            background: linear-gradient(145deg, rgba(105, 241, 166, 0.045), transparent 48%), rgba(3, 28, 19, 0.58) !important;
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.36), 0 0 42px rgba(53, 223, 135, 0.055) !important;
            backdrop-filter: blur(30px) saturate(128%) !important;
            -webkit-backdrop-filter: blur(30px) saturate(128%) !important;
          }

          .login-brand-row {
            display: flex;
            min-width: 0;
            align-items: center;
            justify-content: space-between;
            gap: 1.35rem;
            padding: 0.05rem 0.1rem 0;
          }

          .login-brand-row .login-title-image {
            width: min(74%, 292px);
            min-width: 0;
            margin: 0;
            flex: 0 1 292px;
          }

          .language-flag-toggle {
            display: grid;
            width: 44px;
            height: 40px;
            min-width: 44px;
            min-height: 40px;
            flex: 0 0 44px;
            margin: 0;
            padding: 0;
            place-items: center;
            color: #edf7f1;
            border: 1px solid rgba(137, 219, 174, 0.26);
            border-radius: 11px;
            background: linear-gradient(145deg, rgba(94, 232, 156, 0.06), transparent), rgba(3, 25, 17, 0.56);
            box-shadow: inset 0 1px rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: border-color 150ms ease, background 150ms ease, transform 150ms ease, box-shadow 150ms ease;
          }

          .language-flag-toggle > span {
            font-size: 1.16rem;
            line-height: 1;
            filter: saturate(1.05);
          }

          .language-flag-toggle:hover:not(:disabled) {
            border-color: rgba(110, 239, 168, 0.48);
            background: rgba(12, 54, 36, 0.7);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
            transform: translateY(-1px);
          }

          .language-flag-toggle:focus-visible {
            outline: none;
            border-color: rgba(104, 244, 167, 0.72);
            box-shadow: 0 0 0 3px rgba(72, 232, 145, 0.13);
          }

          .language-flag-toggle:disabled { cursor: default; opacity: 0.55; }

          .login-card > .brand-copy {
            max-width: none;
            margin: 0.38rem 0.1rem 0.72rem !important;
            color: #b9cbc1 !important;
            font-size: 0.84rem !important;
            line-height: 1.4 !important;
            text-align: left;
          }

          .login-card > .login-divider { margin: 0 0 0.72rem; }

          .login-card form .login-input input:-webkit-autofill,
          .login-card form .login-input input:-webkit-autofill:hover,
          .login-card form .login-input input:-webkit-autofill:focus,
          .login-card form .login-input input:-webkit-autofill:active {
            -webkit-text-fill-color: #f3f8f5 !important;
            caret-color: #f3f8f5 !important;
            -webkit-box-shadow: 0 0 0 1000px #08281d inset !important;
            box-shadow: 0 0 0 1000px #08281d inset !important;
            transition: background-color 9999s ease-out 0s !important;
          }

          .login-card form .login-input input:autofill {
            color: #f3f8f5 !important;
            box-shadow: 0 0 0 1000px #08281d inset !important;
          }

          @media (max-width: 680px) {
            .login-brand-row { gap: 0.8rem; }
            .login-brand-row .login-title-image { width: min(76%, 244px); }
            .language-flag-toggle { width: 42px; height: 38px; min-width: 42px; min-height: 38px; flex-basis: 42px; }
            .login-header .service-health-indicator { width: 32px; height: 32px; flex-basis: 32px; }
          }
          '''
          css_path.write_text(css)
          PY

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/login-polish-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ux): polish login language health and autofill'
          git push origin HEAD:fix/ux-2.1-login-polish-v2

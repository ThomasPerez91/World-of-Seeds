name: WOS UI 2.1 version normalization

on:
  push:
    branches:
      - ux/2.1-login-branding

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ux/2.1-login-branding
          fetch-depth: 0

      - name: Restore canonical stable release metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/versioning.py set --channel v2 2.0.0
          python3 scripts/versioning.py check --channel v2 --expected-version 2.0.0

      - name: Keep the visible product UI on 2.1.0
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > frontend/src/uiVersion.ts <<'EOF'
          export const UI_VERSION = "2.1.0";
          EOF
          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/App.tsx")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              'import { APP_VERSION } from "./version";',
              'import { UI_VERSION } from "./uiVersion";',
          )
          source = source.replace("{APP_VERSION}", "{UI_VERSION}")
          path.write_text(source, encoding="utf-8")
          PY
          grep -q 'UI_VERSION = "2.1.0"' frontend/src/uiVersion.ts
          grep -q 'import { UI_VERSION } from "./uiVersion";' frontend/src/App.tsx
          if grep -q '{APP_VERSION}' frontend/src/App.tsx; then
            echo 'APP_VERSION remains in App.tsx' >&2
            exit 1
          fi

      - name: Remove one-shot workflow
        shell: bash
        run: rm -f .github/workflows/wos-ui-2.1-normalize.yml

      - name: Commit normalization
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(version): separate WOS 2.1 UI from frozen 2.0 release metadata'
          git push origin HEAD:ux/2.1-login-branding

name: WOS UI 2.1 test normalization

on:
  push:
    branches:
      - ux/2.1-login-branding

permissions:
  contents: write

jobs:
  normalize-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ux/2.1-login-branding
          fetch-depth: 0

      - name: Point UI assertions at the visible product version
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/App.test.tsx")
          source = path.read_text(encoding="utf-8")
          old = 'import { APP_VERSION } from "./version";'
          new = 'import { UI_VERSION } from "./uiVersion";'
          if old not in source:
              raise SystemExit("APP_VERSION test import not found")
          source = source.replace(old, new, 1)
          source = source.replace('`v${APP_VERSION}`', '`v${UI_VERSION}`')
          path.write_text(source, encoding="utf-8")
          PY
          grep -q 'import { UI_VERSION } from "./uiVersion";' frontend/src/App.test.tsx
          if grep -q 'APP_VERSION' frontend/src/App.test.tsx; then
            echo 'APP_VERSION remains in App.test.tsx' >&2
            exit 1
          fi

      - name: Remove one-shot workflow
        shell: bash
        run: rm -f .github/workflows/wos-ui-2.1-test-normalize.yml

      - name: Commit test normalization
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(frontend): assert the WOS 2.1 visible UI version'
          git push origin HEAD:ux/2.1-login-branding

name: Publish release

on:
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: world-of-seeds-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish stable release
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve and validate the application version
        id: version
        run: |
          set -Eeuo pipefail
          version="$(python3 scripts/versioning.py check --print-version)"
          python3 scripts/versioning.py check --expected-tag "v$version"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Prepare or verify the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -Eeuo pipefail
          releases_json="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          release_json="$(jq -c --arg tag "$RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag)] | if length > 1 then error("duplicate releases") else .[0] // null end' \
            <<<"$releases_json")"
          if [[ "$release_json" != "null" ]]; then
            jq -e \
              --arg tag "$RELEASE_TAG" \
              --arg sha "$GITHUB_SHA" \
              '.tag_name == $tag and .prerelease == false and (.target_commitish == "master" or .target_commitish == $sha)' \
              <<<"$release_json" >/dev/null
            if [[ "$(jq -r '.draft' <<<"$release_json")" == "false" ]]; then
              git fetch --force origin \
                "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
              [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$GITHUB_SHA" ]]
            fi
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "World of Seeds $RELEASE_TAG" \
              --draft \
              --generate-notes
          fi

      - name: Dispatch the immutable release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -Eeuo pipefail
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            '{event_type: "deploy-release", client_payload: {sha: $sha, tag: $tag, version: $version}}' \
            | gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/dispatches" \
                --input -

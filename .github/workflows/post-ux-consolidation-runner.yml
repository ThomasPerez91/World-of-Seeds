name: Post-UX consolidation runner

on:
  push:
    branches:
      - refactor/post-ux-consolidation
    paths:
      - .github/workflows/post-ux-consolidation-runner.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Execute corrected bounded cleanup script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/post-ux-consolidation.yml").read_text(encoding="utf-8")
          marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n\n      - name: Sanity-check changed sources"
          if marker not in workflow or end_marker not in workflow:
              raise RuntimeError("cleanup script markers changed")
          script = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(script)
          script = script.replace(
              'exclude={"backend/app/files/downloads.py"}',
              'exclude={"backend/app/files/downloads.py", "backend/app/files/__init__.py"}',
              1,
          )
          exec(compile(script, "post-ux-consolidation.py", "exec"), {"__name__": "__main__"})
          PY
      - name: Sanity-check changed sources
        shell: bash
        run: |
          git diff --check
          python3 -m compileall -q backend/app backend/tests
          grep -R "from app.files\|app.files.downloads" -n backend/app backend/tests && exit 1 || true
          grep -R "api/storage" -n frontend/src && exit 1 || true
          grep -R "admin-trash\|error.workspaceUnavailable" -n frontend/src backend/tests && exit 1 || true
      - name: Commit cleanup to feature branch
        shell: bash
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidate post-UX architecture"
          git push origin HEAD:refactor/post-ux-consolidation

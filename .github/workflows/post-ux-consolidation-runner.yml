name: Post-UX consolidation runner

on:
  push:
    branches:
      - refactor/post-ux-consolidation
    paths:
      - .github/workflows/post-ux-consolidation-runner.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Execute corrected bounded cleanup script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/post-ux-consolidation.yml").read_text(encoding="utf-8")
          marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n\n      - name: Sanity-check changed sources"
          if marker not in workflow or end_marker not in workflow:
              raise RuntimeError("cleanup script markers changed")
          script = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(script)
          script = script.replace(
              'exclude={"backend/app/files/downloads.py"}',
              'exclude={"backend/app/files/downloads.py", "backend/app/files/__init__.py"}',
              1,
          )
          script = script.replace(
              'if source_contains(import_name, exclude={module}):',
              'if source_contains(f"from {import_name} import", exclude={module}):',
              1,
          )
          script = script.replace(
              'styles = remove_matching_rules(read(styles_path), ".admin-trash")',
              'styles = re.sub(r"(?ms)(?:^|\\n)([^{}]*\\.admin-trash[^{}]*)\\{[^{}]*\\}\\s*", "\\n", read(styles_path))',
              1,
          )
          exec(compile(script, "post-ux-consolidation.py", "exec"), {"__name__": "__main__"})

          dashboard_test_path = Path("frontend/src/features/dashboard/UserDashboardPage.test.tsx")
          dashboard_test = dashboard_test_path.read_text(encoding="utf-8")
          legacy_import = 'import * as storageApi from "../../api/storage";\n'
          if dashboard_test.count(legacy_import) != 1:
              raise RuntimeError("dashboard storage test import marker changed")
          dashboard_test = dashboard_test.replace(legacy_import, "", 1)
          dashboard_test = dashboard_test.replace(
              'vi.spyOn(storageApi, "getSharedStorageCapacity")',
              'vi.spyOn(api, "getSharedStorageCapacity")',
          )
          if "storageApi" in dashboard_test or "api/storage" in dashboard_test:
              raise RuntimeError("dashboard tests still depend on standalone storage client")
          dashboard_test_path.write_text(dashboard_test, encoding="utf-8")

          i18n_path = Path("frontend/src/i18n.tsx")
          i18n = i18n_path.read_text(encoding="utf-8")
          legacy_error_codes = {
              "user_workspace_unavailable",
              "user_storage_unavailable",
              "file_path_invalid",
              "file_path_blocked",
              "directory_not_found",
              "trash_entry_not_found",
              "trash_restore_target_unavailable",
              "trash_integrity_failed",
              "trash_operation_unverified",
              "trash_purge_incomplete",
              "trash_storage_unavailable",
          }
          kept_lines = []
          removed_codes = set()
          for line in i18n.splitlines(keepends=True):
              stripped = line.strip()
              matched = next((code for code in legacy_error_codes if stripped.startswith(f"{code}:")), None)
              if matched is not None:
                  removed_codes.add(matched)
                  continue
              kept_lines.append(line)
          if removed_codes != legacy_error_codes:
              missing = sorted(legacy_error_codes - removed_codes)
              raise RuntimeError(f"legacy error mappings changed or missing: {missing}")
          i18n_path.write_text("".join(kept_lines), encoding="utf-8")
          PY
      - name: Sanity-check changed sources
        shell: bash
        run: |
          git diff --check
          python3 -m compileall -q backend/app backend/tests
          grep -R "from app.files\|app.files.downloads" -n backend/app backend/tests && exit 1 || true
          grep -R "api/storage" -n frontend/src && exit 1 || true
          grep -R "admin-trash\|error.workspaceUnavailable" -n frontend/src && exit 1 || true
      - name: Commit cleanup to feature branch
        shell: bash
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidate post-UX architecture"
          git push origin HEAD:refactor/post-ux-consolidation

name: WOS 2.1 one-shot branding bootstrap

on:
  push:
    branches:
      - ux/2.1-login-branding

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ux/2.1-login-branding
          fetch-depth: 0

      - name: Reconstruct uploaded branding assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p frontend/public
          cat .github/wos-assets-bootstrap/background.part-* | base64 --decode > frontend/public/background.webp
          cat .github/wos-assets-bootstrap/favicon.part-* | base64 --decode > frontend/public/favicon.ico
          test -s frontend/public/background.webp
          test -s frontend/public/favicon.ico
          file frontend/public/background.webp frontend/public/favicon.ico

      - name: Bump World of Seeds to 2.1.0
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/versioning.py set --channel v2 2.1.0
          python3 scripts/versioning.py check --channel v2 --expected-version 2.1.0

      - name: Remove one-shot bootstrap sources
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .github/wos-assets-bootstrap
          rm -f .github/workflows/wos-2.1-bootstrap.yml

      - name: Commit reconstructed assets and synchronized version
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(branding): install WOS 2.1 assets and bump version'
          git push origin HEAD:ux/2.1-login-branding

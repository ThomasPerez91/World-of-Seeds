name: Rise2 qB bootstrap

on:
  push:
    branches: [develop, master]
    paths:
      - ".github/workflows/rise2-qb-bootstrap.yml"
      - "deploy/compose.rise2.v2.yaml"
      - "deploy/.env.rise2.v2.example"
      - "scripts/rise2_v2_preflight.sh"
      - "scripts/rise2_v2_qb_*.py"
      - "scripts/rise2_v2_qb_*.sh"
      - "scripts/rise2_v2_integration_entrypoint.py"
  pull_request:
    branches: [develop, master]
    paths:
      - ".github/workflows/rise2-qb-bootstrap.yml"
      - "deploy/compose.rise2.v2.yaml"
      - "deploy/.env.rise2.v2.example"
      - "scripts/rise2_v2_preflight.sh"
      - "scripts/rise2_v2_qb_*.py"
      - "scripts/rise2_v2_qb_*.sh"
      - "scripts/rise2_v2_integration_entrypoint.py"

permissions:
  contents: read

concurrency:
  group: rise2-qb-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wipe-smoke:
    name: qB fresh-volume restart recreate wipe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment scripts
        run: |
          bash -n scripts/rise2_v2_preflight.sh scripts/rise2_v2_qb_reconcile.sh
          shellcheck scripts/rise2_v2_qb_reconcile.sh
          python3 -m py_compile scripts/rise2_v2_qb_bootstrap.py scripts/rise2_v2_qb_probe.py scripts/rise2_v2_qb_smoke.py scripts/rise2_v2_integration_entrypoint.py
      - name: Real immutable-image smoke (no build, publish or deployment)
        run: sudo python3 scripts/rise2_v2_qb_smoke.py

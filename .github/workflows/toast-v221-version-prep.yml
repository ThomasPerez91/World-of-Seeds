name: Toast v2.2.1 version prep

on:
  push:
    branches:
      - fix/toast-system-v2.2.1
    paths:
      - .github/workflows/toast-v221-version-prep.yml

permissions:
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/toast-system-v2.2.1
          fetch-depth: 0

      - name: Update canonical version mirrors
        run: |
          set -Eeuo pipefail
          python scripts/versioning.py set --channel v2 2.2.1
          python scripts/versioning.py check --channel v2 --expected-version 2.2.1 --print-version
          grep -Fx 'export const UI_VERSION = "2.2.1";' frontend/src/uiVersion.ts
          git diff --check

      - name: Commit generated version mirrors and remove helper
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/toast-v221-version-prep.yml
          git add VERSION backend/pyproject.toml backend/app/__init__.py backend/uv.lock frontend/package.json frontend/package-lock.json frontend/src/version.ts frontend/src/uiVersion.ts frontend/src/uiVersion.test.ts
          git diff --cached --check
          git commit -m "chore(release): bump World of Seeds to 2.2.1"
          git push origin HEAD:fix/toast-system-v2.2.1

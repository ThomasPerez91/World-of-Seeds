services:
  node-exporter:
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.textfile.directory=/var/lib/node-exporter/textfile
    volumes:
      - type: bind
        source: ${WOS_V2_NODE_EXPORTER_TEXTFILE_PATH:-/var/lib/world-of-seeds-v2/node-exporter-textfile}
        target: /var/lib/node-exporter/textfile
        read_only: true
        bind: {create_host_path: false}

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/${WOS_V2_POSTGRES_DB:?set WOS_V2_POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${WOS_V2_POSTGRES_USER:?set WOS_V2_POSTGRES_USER}
      DATA_SOURCE_PASS: ${WOS_V2_POSTGRES_PASSWORD:?set WOS_V2_POSTGRES_PASSWORD}
    networks: [backend, monitoring]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64

  redis-exporter:
    image: oliver006/redis_exporter:v1.89.0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    networks: [backend, monitoring]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - type: bind
        source: ../monitoring/blackbox/blackbox.yml
        target: /etc/blackbox_exporter/config.yml
        read_only: true
    networks: [backend, torrent, monitoring]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64

  torrent-metrics:
    image: ${WOS_V2_IMAGE:?set immutable WOS_V2_IMAGE digest}
    pull_policy: always
    restart: unless-stopped
    user: "0:0"
    working_dir: /app/backend
    command: [python, -m, app.observability.torrent_metrics_exporter]
    environment:
      WOS_TORRENT_METRICS_PORT: "9101"
      WOS_TORRENT_METRICS_SECRET_PATH: /run/secrets/integration_registry
      WOS_TORRENT_METRICS_NEWGREEDY_STATS_PATH: /newgreedy/stats.json
    depends_on:
      qbittorrent:
        condition: service_healthy
      newgreedy:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${WOS_V2_QBITTORRENT_CONFIG_PATH:?set WOS_V2_QBITTORRENT_CONFIG_PATH}.runtime/wos
        target: /run/secrets
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${WOS_V2_NEWGREEDY_STATE_HOST_PATH:?set WOS_V2_NEWGREEDY_STATE_HOST_PATH}/stats.json
        target: /newgreedy/stats.json
        read_only: true
        bind: {create_host_path: false}
    networks: [torrent, monitoring]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; body=urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=2).read().decode(); assert 'wos_torrent_metrics_qb_scrape_success 1' in body and 'wos_torrent_metrics_newgreedy_scrape_success 1' in body
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    volumes:
      - type: bind
        source: ../monitoring/prometheus/prometheus.rise2.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true

name: world-of-seeds-v2-rise2

x-wos-environment: &wos-environment
  WOS_ENVIRONMENT: production
  WOS_RUNTIME_PROFILE: v2
  WOS_COOKIE_SECURE: "true"
  WOS_API_PROCESS_COUNT: "1"
  WOS_ALLOWED_HOSTS: '${WOS_V2_ALLOWED_HOSTS:?set WOS_V2_ALLOWED_HOSTS}'
  WOS_DATA_ROOT: /data
  WOS_QBITTORRENT_DATA_ROOT: /data
  WOS_POSTGRES_HOST: postgres
  WOS_POSTGRES_PORT: "5432"
  WOS_POSTGRES_DB: ${WOS_V2_POSTGRES_DB:?set WOS_V2_POSTGRES_DB}
  WOS_POSTGRES_USER: ${WOS_V2_POSTGRES_USER:?set WOS_V2_POSTGRES_USER}
  WOS_POSTGRES_PASSWORD: ${WOS_V2_POSTGRES_PASSWORD:?set WOS_V2_POSTGRES_PASSWORD}
  WOS_REDIS_URL: redis://redis:6379/0

x-wos-runtime: &wos-runtime
  image: ${WOS_V2_IMAGE:?set immutable WOS_V2_IMAGE digest}
  pull_policy: always
  user: "${WOS_V2_APP_UID:?set WOS_V2_APP_UID}:${WOS_V2_APP_GID:?set WOS_V2_APP_GID}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m

services:
  ingress:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      grafana:
        condition: service_started
    environment:
      WOS_V2_PUBLIC_HOST: ${WOS_V2_PUBLIC_HOST:?set WOS_V2_PUBLIC_HOST}
      WOS_V2_GRAFANA_HOST: ${WOS_V2_GRAFANA_HOST:?set WOS_V2_GRAFANA_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - type: bind
        source: ./Caddyfile.rise2.v2
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy_v2_data:/data
      - caddy_v2_config:/config
    networks:
      edge: {ipv4_address: 172.30.0.2}
      monitoring-edge:
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128

  migrate:
    <<: *wos-runtime
    restart: "no"
    working_dir: /app/backend
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment: *wos-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  api:
    <<: *wos-runtime
    restart: unless-stopped
    environment:
      <<: *wos-environment
      UVICORN_LOG_LEVEL: ${WOS_V2_LOG_LEVEL:-info}
      FORWARDED_ALLOW_IPS: 172.30.0.2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${WOS_V2_STORAGE_HOST_PATH:?set isolated WOS_V2_STORAGE_HOST_PATH}
        target: /data
    networks:
      edge: {ipv4_address: 172.30.0.3}
      backend:
    pids_limit: 256
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *wos-runtime
    command: ["python", "/bootstrap/integration-entrypoint.py", "app.worker"]
    restart: unless-stopped
    stop_grace_period: 35s
    environment:
      <<: *wos-environment
    secrets: [integration_registry]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
      newgreedy:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../scripts/rise2_v2_integration_entrypoint.py
        target: /bootstrap/integration-entrypoint.py
        read_only: true
      - type: bind
        source: ${WOS_V2_STORAGE_HOST_PATH:?set isolated WOS_V2_STORAGE_HOST_PATH}
        target: /data
    networks: [backend, torrent]
    pids_limit: 128
    deploy:
      replicas: ${WOS_V2_WORKER_REPLICAS:-2}

  scheduler:
    <<: *wos-runtime
    command: ["python", "/bootstrap/integration-entrypoint.py", "app.scheduler_service"]
    restart: unless-stopped
    stop_grace_period: 35s
    environment:
      <<: *wos-environment
    secrets: [integration_registry]
    depends_on:
      migrate:
        condition: service_completed_successfully
      qbittorrent:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../scripts/rise2_v2_integration_entrypoint.py
        target: /bootstrap/integration-entrypoint.py
        read_only: true
      - type: bind
        source: ${WOS_V2_STORAGE_HOST_PATH:?set isolated WOS_V2_STORAGE_HOST_PATH}
        target: /data
    networks: [backend, torrent]
    pids_limit: 128

  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WOS_V2_POSTGRES_DB:?set WOS_V2_POSTGRES_DB}
      POSTGRES_USER: ${WOS_V2_POSTGRES_USER:?set WOS_V2_POSTGRES_USER}
      POSTGRES_PASSWORD: ${WOS_V2_POSTGRES_PASSWORD:?set WOS_V2_POSTGRES_PASSWORD}
    volumes: [postgres_v2_data:/var/lib/postgresql/data]
    networks: [backend]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  redis:
    image: redis:8.2.9-alpine3.22
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --save, "60", "1", --loglevel, warning]
    volumes: [redis_v2_data:/data]
    networks: [backend]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 6

  qbittorrent-init:
    image: qbittorrentofficial/qbittorrent-nox:5.2.3-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        exec /bin/sh /bootstrap/reconcile.sh --init
    environment:
      QBT_UID: ${WOS_V2_QBITTORRENT_UID:?set WOS_V2_QBITTORRENT_UID}
      QBT_GID: ${WOS_V2_QBITTORRENT_GID:?set WOS_V2_QBITTORRENT_GID}
    volumes:
      - qbittorrent_v2_config:/config
      - type: bind
        source: ${WOS_V2_QBITTORRENT_CONFIG_PATH:?set WOS_V2_QBITTORRENT_CONFIG_PATH}
        target: /bootstrap/qBittorrent.conf
        read_only: true
        bind: {create_host_path: false}
      - {type: bind, source: ./qbittorrent.rise2.conf, target: /bootstrap/policy.conf, read_only: true}
      - {type: bind, source: ../scripts/rise2_v2_qb_reconcile.sh, target: /bootstrap/reconcile.sh, read_only: true}
      - {type: bind, source: ../scripts/rise2_v2_qb_reconcile.awk, target: /bootstrap/reconcile.awk, read_only: true}
    networks: [torrent]
    user: "0:0"
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]

  qbittorrent:
    image: qbittorrentofficial/qbittorrent-nox:5.2.3-1
    restart: unless-stopped
    stop_grace_period: 30m
    depends_on:
      qbittorrent-init:
        condition: service_completed_successfully
      newgreedy-ca-export:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /bin/sh /bootstrap/reconcile.sh
        public_ca=/wos-ca/mitmproxy-ca-cert.pem
        system_bundle=/etc/ssl/certs/ca-certificates.crt
        test -s "$$public_ca"
        test -s "$$system_bundle"
        grep -q '^-----BEGIN CERTIFICATE-----$$' "$$public_ca"
        ! grep -q 'PRIVATE KEY' "$$public_ca"
        printf '\n' >> "$$system_bundle"
        cat "$$public_ca" >> "$$system_bundle"
        printf '\n' >> "$$system_bundle"
        exec /sbin/tini -g -- /entrypoint.sh
    environment:
      PUID: ${WOS_V2_QBITTORRENT_UID:?set WOS_V2_QBITTORRENT_UID}
      PGID: ${WOS_V2_QBITTORRENT_GID:?set WOS_V2_QBITTORRENT_GID}
      QBT_LEGAL_NOTICE: confirm
      QBT_WEBUI_PORT: "8080"
      UMASK: "077"
    volumes:
      - qbittorrent_v2_config:/config
      - type: bind
        source: ${WOS_V2_QBITTORRENT_CONFIG_PATH:?set WOS_V2_QBITTORRENT_CONFIG_PATH}
        target: /bootstrap/qBittorrent.conf
        read_only: true
        bind: {create_host_path: false}
      - {type: bind, source: ./qbittorrent.rise2.conf, target: /bootstrap/policy.conf, read_only: true}
      - {type: bind, source: ../scripts/rise2_v2_qb_reconcile.sh, target: /bootstrap/reconcile.sh, read_only: true}
      - {type: bind, source: ../scripts/rise2_v2_qb_reconcile.awk, target: /bootstrap/reconcile.awk, read_only: true}
      - type: bind
        source: ${WOS_V2_STORAGE_HOST_PATH:?set isolated WOS_V2_STORAGE_HOST_PATH}
        target: /data
      - type: volume
        source: newgreedy_v2_public_ca
        target: /wos-ca
        read_only: true
    networks: [torrent, torrent-egress]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, KILL, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  newgreedy-init:
    image: ${WOS_V2_NEWGREEDY_IMAGE:?set immutable WOS_V2_NEWGREEDY_IMAGE digest}
    pull_policy: always
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for name in stats.json torrent_registry.json newgreedy.log purge_pending.json; do
          path="/state/$$name"
          test ! -L "$$path"
          if [ ! -e "$$path" ]; then
            case "$$name" in
              newgreedy.log) : >"$$path" ;;
              purge_pending.json) printf '[]\n' >"$$path" ;;
              *) printf '{}\n' >"$$path" ;;
            esac
          fi
          test -f "$$path"
          chmod 0600 "$$path"
        done
    volumes:
      - type: bind
        source: ${WOS_V2_NEWGREEDY_STATE_HOST_PATH:?set WOS_V2_NEWGREEDY_STATE_HOST_PATH}
        target: /state
        bind: {create_host_path: false}
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32

  newgreedy:
    image: ${WOS_V2_NEWGREEDY_IMAGE:?set immutable WOS_V2_NEWGREEDY_IMAGE digest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      newgreedy-init:
        condition: service_completed_successfully
    group_add:
      - "${WOS_V2_NEWGREEDY_GID:?set WOS_V2_NEWGREEDY_GID}"
    read_only: true
    volumes:
      - type: bind
        source: ${WOS_V2_NEWGREEDY_CONFIG_PATH:?set WOS_V2_NEWGREEDY_CONFIG_PATH}
        target: /app/config.ini
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${WOS_V2_NEWGREEDY_STATE_HOST_PATH:?set WOS_V2_NEWGREEDY_STATE_HOST_PATH}/stats.json
        target: /app/stats.json
        bind: {create_host_path: false}
      - type: bind
        source: ${WOS_V2_NEWGREEDY_STATE_HOST_PATH:?set WOS_V2_NEWGREEDY_STATE_HOST_PATH}/torrent_registry.json
        target: /app/torrent_registry.json
        bind: {create_host_path: false}
      - type: bind
        source: ${WOS_V2_NEWGREEDY_STATE_HOST_PATH:?set WOS_V2_NEWGREEDY_STATE_HOST_PATH}/newgreedy.log
        target: /app/newgreedy.log
        bind: {create_host_path: false}
      - type: bind
        source: ${WOS_V2_NEWGREEDY_STATE_HOST_PATH:?set WOS_V2_NEWGREEDY_STATE_HOST_PATH}/purge_pending.json
        target: /app/purge_pending.json
        bind: {create_host_path: false}
      - type: volume
        source: newgreedy_v2_ca
        target: /root/.mitmproxy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    networks: [torrent, torrent-egress]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  newgreedy-ca-export:
    image: ${WOS_V2_NEWGREEDY_IMAGE:?set immutable WOS_V2_NEWGREEDY_IMAGE digest}
    pull_policy: always
    restart: "no"
    depends_on:
      newgreedy:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        source=/private/mitmproxy-ca-cert.pem
        target=/public/mitmproxy-ca-cert.pem
        test -s "$$source"
        grep -q '^-----BEGIN CERTIFICATE-----$$' "$$source"
        ! grep -q 'PRIVATE KEY' "$$source"
        tmp="$$target.tmp"
        cat "$$source" > "$$tmp"
        chmod 0444 "$$tmp"
        mv -f "$$tmp" "$$target"
        test -s "$$target"
        ! grep -q 'PRIVATE KEY' "$$target"
    volumes:
      - type: volume
        source: newgreedy_v2_ca
        target: /private
        read_only: true
      - type: volume
        source: newgreedy_v2_public_ca
        target: /public
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${WOS_V2_PROMETHEUS_RETENTION:-15d}
    volumes:
      - type: bind
        source: ../monitoring/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ../monitoring/prometheus/alerts.yml
        target: /etc/prometheus/alerts.yml
        read_only: true
      - prometheus_v2_data:/prometheus
    networks: [backend, monitoring]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${WOS_V2_GRAFANA_ADMIN_USER:?set WOS_V2_GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${WOS_V2_GRAFANA_ADMIN_PASSWORD:?set WOS_V2_GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${WOS_V2_GRAFANA_HOST:?set WOS_V2_GRAFANA_HOST}
      GF_SERVER_ROOT_URL: https://${WOS_V2_GRAFANA_HOST:?set WOS_V2_GRAFANA_HOST}
    volumes:
      - type: bind
        source: ../monitoring/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ../monitoring/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
      - grafana_v2_data:/var/lib/grafana
    networks: [monitoring, monitoring-edge]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - {type: bind, source: /proc, target: /host/proc, read_only: true}
      - {type: bind, source: /sys, target: /host/sys, read_only: true}
      - type: bind
        source: /
        target: /host/root
        read_only: true
        bind: {propagation: rslave}
    networks: [monitoring]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    privileged: true
    volumes:
      - {type: bind, source: /, target: /rootfs, read_only: true}
      - {type: bind, source: /var/run, target: /var/run, read_only: true}
      - {type: bind, source: /sys, target: /sys, read_only: true}
      - {type: bind, source: /var/lib/docker, target: /var/lib/docker, read_only: true}
    networks: [monitoring]
    pids_limit: 128

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend: {internal: true}
  torrent: {internal: true}
  torrent-egress: {}
  monitoring: {internal: true}
  monitoring-edge: {internal: true}

secrets:
  integration_registry:
    environment: WOS_V2_INTEGRATION_ACCOUNTS_JSON

volumes:
  postgres_v2_data:
  redis_v2_data:
  qbittorrent_v2_config:
  newgreedy_v2_ca:
  newgreedy_v2_public_ca:
  prometheus_v2_data:
  grafana_v2_data:
  caddy_v2_data:
  caddy_v2_config:

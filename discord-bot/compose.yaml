name: wos-discord-bot
services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - bot-data:/app/data
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "app.py", "--health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
volumes:
  bot-data:
